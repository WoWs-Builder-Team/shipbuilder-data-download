name: Download GameData
on:
  workflow_dispatch:
    inputs:
      game-version:
        required: true
        type: string
        description: The current version of the game
      modifiers-url:
        required: false
        type: string
        description: Optional URL to a custom Modifiers.json, defaults to the one from the DataConverter repository
      extract-image-assets:
        required: false
        type: boolean
        default: false
        description: Optional parameter to select if image assets should be extracted

jobs:
  download-data:
    uses: ./.github/workflows/download-data.yml
    with:
      game-version: ${{ inputs.game-version }}
      modifiers-url: ${{ inputs.modifiers-url }}
    secrets: inherit

  download-ship-assets:
    # the data job logs in with the password and caches the login token, so running
    # after it lets this job reuse the token instead of triggering a second login
    needs: download-data
    if: ${{ inputs.extract-image-assets }}
    uses: ./.github/workflows/download-ship-assets.yml
    with:
      game-version: ${{ inputs.game-version }}
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [download-data, download-ship-assets]
    if: ${{ !cancelled() && needs.download-data.result == 'success' }}
    steps:
      - name: Check out composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load configuration
        id: config
        uses: ./.github/actions/config

      - name: Write job summary
        env:
          VERSION: ${{ inputs.game-version }}
          RETENTION_DAYS: ${{ steps.config.outputs.retention-days }}
          CLIENT_DEPOT: ${{ steps.config.outputs.client-depot }}
          RES_DEPOT: ${{ steps.config.outputs.res-depot }}
          DEPOT_DOWNLOADER: ${{ steps.config.outputs.depot-downloader-tag }}
          WOWSUNPACK: ${{ steps.config.outputs.wows-toolkit-tag }}
          BUILD: ${{ needs.download-data.outputs.build }}
          MANIFEST_ID: ${{ needs.download-data.outputs.manifest-id }}
          MODIFIERS_SOURCE: ${{ needs.download-data.outputs.modifiers-source }}
          BUNDLE: ${{ needs.download-data.outputs.bundle }}
          BUNDLE_SIZE: ${{ needs.download-data.outputs.size }}
          BUNDLE_CONTENTS: ${{ needs.download-data.outputs.contents }}
          ARTIFACT_URL: ${{ needs.download-data.outputs.url }}
          ARTIFACT_DIGEST: ${{ needs.download-data.outputs.digest }}
          ASSETS_RESULT: ${{ needs.download-ship-assets.result }}
          ASSETS_FILES: ${{ needs.download-ship-assets.outputs.files }}
          ASSETS_BUNDLE: ${{ needs.download-ship-assets.outputs.bundle }}
          ASSETS_SIZE: ${{ needs.download-ship-assets.outputs.size }}
          ASSETS_CONTENTS: ${{ needs.download-ship-assets.outputs.contents }}
          ASSETS_URL: ${{ needs.download-ship-assets.outputs.url }}
          ASSETS_DIGEST: ${{ needs.download-ship-assets.outputs.digest }}
          ASSETS_NEW_FILES: ${{ needs.download-ship-assets.outputs.new-files }}
          ASSETS_DIFF_BUNDLE: ${{ needs.download-ship-assets.outputs.diff-bundle }}
          ASSETS_DIFF_SIZE: ${{ needs.download-ship-assets.outputs.diff-size }}
          ASSETS_DIFF_URL: ${{ needs.download-ship-assets.outputs.diff-url }}
          ASSETS_DIFF_DIGEST: ${{ needs.download-ship-assets.outputs.diff-digest }}
          ASSETS_PREVIOUS_URL: ${{ needs.download-ship-assets.outputs.previous-url }}
          ASSETS_PREVIOUS_FILES: ${{ needs.download-ship-assets.outputs.previous-files }}
        run: |
          {
            echo "# Game data $VERSION"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Artifact | [\`$BUNDLE\`]($ARTIFACT_URL) |"
            echo "| Size | $BUNDLE_SIZE |"
            echo "| Expires | in $RETENTION_DAYS days |"
            echo "| Game version | \`$VERSION\` |"
            echo "| Game build | \`$BUILD\` |"
            echo "| Client depot | \`$CLIENT_DEPOT\` (manifest \`$MANIFEST_ID\`) |"
            echo "| Res depot | \`$RES_DEPOT\` |"
            echo "| Modifiers source | $MODIFIERS_SOURCE |"
            if [ -n "$ARTIFACT_DIGEST" ]; then
              echo "| Artifact sha256 | \`$ARTIFACT_DIGEST\` |"
            fi
            echo
            echo "## Contents"
            echo
            echo "| Entry | Size |"
            echo "| --- | --- |"
            echo "$BUNDLE_CONTENTS"
            echo
            echo "# Ship assets"
            echo
            case "$ASSETS_RESULT" in
              success)
                echo "| | |"
                echo "| --- | --- |"
                echo "| Artifact | [\`$ASSETS_BUNDLE\`]($ASSETS_URL) |"
                echo "| Size | $ASSETS_SIZE |"
                echo "| Expires | in $RETENTION_DAYS days |"
                echo "| Previews | $ASSETS_FILES files |"
                if [ -n "$ASSETS_DIGEST" ]; then
                  echo "| Artifact sha256 | \`$ASSETS_DIGEST\` |"
                fi
                if [ -n "$ASSETS_CONTENTS" ]; then
                  echo
                  echo "## Contents"
                  echo
                  echo "| Entry | Size |"
                  echo "| --- | --- |"
                  echo "$ASSETS_CONTENTS"
                fi
                echo
                echo "## New previews"
                echo
                echo "Compared against [\`$ASSETS_PREVIOUS_URL\`]($ASSETS_PREVIOUS_URL) ($ASSETS_PREVIOUS_FILES images)."
                echo
                if [ -n "$ASSETS_DIFF_BUNDLE" ]; then
                  echo "| | |"
                  echo "| --- | --- |"
                  echo "| Artifact | [\`$ASSETS_DIFF_BUNDLE\`]($ASSETS_DIFF_URL) |"
                  echo "| Size | $ASSETS_DIFF_SIZE |"
                  echo "| Expires | in $RETENTION_DAYS days |"
                  echo "| New previews | $ASSETS_NEW_FILES files |"
                  if [ -n "$ASSETS_DIFF_DIGEST" ]; then
                    echo "| Artifact sha256 | \`$ASSETS_DIFF_DIGEST\` |"
                  fi
                else
                  echo "No preview is new, so no diff bundle was created."
                fi
                ;;
              skipped|'')
                echo "Not requested, run the workflow with \`extract-image-assets\` to include them."
                ;;
              *)
                echo "> [!WARNING]"
                echo "> Extracting the ship assets did not succeed (result: \`$ASSETS_RESULT\`), see the job log for details."
                ;;
            esac
            echo
            echo "# Tools"
            echo
            echo "| Tool | Version |"
            echo "| --- | --- |"
            echo "| DepotDownloader | \`$DEPOT_DOWNLOADER\` |"
            echo "| wowsunpack | \`$WOWSUNPACK\` |"
          } >> "$GITHUB_STEP_SUMMARY"
