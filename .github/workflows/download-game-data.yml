name: Download GameData
on:
  workflow_dispatch:
    inputs:
      game-version:
        required: true
        type: string
        description: The current version of the game
      modifiers-url:
        required: false
        type: string
        description: Optional URL to a custom Modifiers.json, defaults to the one from the DataConverter repository

env:
  WOWS_APP: 552990
  WOWS_CLIENT_DEPOT: 552993
  WOWS_RES_DEPOT: 552994
  GAMEDATA: gamedata
  ARTIFACT_RETENTION_DAYS: 3
  DEPOT_DOWNLOADER_TAG: DepotDownloader_3.4.0
  WOWS_TOOLKIT_TAG: v1.0.1
  WOWS_TOOLKIT_TOOLS_SHA256: d03ac918b7ec9514bb59fa49432132c69103ecb19f121c74d0ed7da2d438cf5b

jobs:
  download-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup steam depot downloader
        id: downloader
        uses: ./.github/actions/setup-release-tool
        with:
          repository: SteamRE/DepotDownloader
          tag: ${{ env.DEPOT_DOWNLOADER_TAG }}
          asset: DepotDownloader-linux-x64.zip
          binary: DepotDownloader

      - name: Setup wowsunpack
        id: wowsunpack
        uses: ./.github/actions/setup-release-tool
        with:
          repository: landaire/wows-toolkit
          tag: ${{ env.WOWS_TOOLKIT_TAG }}
          asset: wows_toolkit_tools_${{ env.WOWS_TOOLKIT_TAG }}_linux64.zip
          binary: wowsunpack
          sha256: ${{ env.WOWS_TOOLKIT_TOOLS_SHA256 }}

      - name: Download manifest file
        id: manifest
        uses: ./.github/actions/download-depot
        with:
          downloader: ${{ steps.downloader.outputs.path }}
          app: ${{ env.WOWS_APP }}
          depot: ${{ env.WOWS_CLIENT_DEPOT }}
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          manifest-only: true

      - name: Create idx download filter
        id: filter
        env:
          MANIFEST: ${{ steps.manifest.outputs.manifest-file }}
        run: |
          grep -oE "bin/[0-9]+/idx/.*" "$MANIFEST" | sort -u > files.txt
          count=$(wc -l < files.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::No idx files matched in $MANIFEST"
            exit 1
          fi
          echo "Matched $count idx files"
          echo "filter=files.txt" >> "$GITHUB_OUTPUT"

      - name: Download idx files
        uses: ./.github/actions/download-depot
        with:
          downloader: ${{ steps.downloader.outputs.path }}
          app: ${{ env.WOWS_APP }}
          depot: ${{ env.WOWS_CLIENT_DEPOT }}
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          manifest: ${{ steps.manifest.outputs.manifest-id }}
          filelist: ${{ steps.filter.outputs.filter }}
          directory: ${{ env.GAMEDATA }}

      - name: Find required pkg files
        id: pkgs
        env:
          WOWSUNPACK: ${{ steps.wowsunpack.outputs.path }}
        run: |
          idx_dir=$(find "$GAMEDATA/bin" -mindepth 2 -maxdepth 2 -type d -name idx | sort -V | tail -n 1)
          if [ -z "$idx_dir" ]; then
            echo "::error::No idx directory found below $GAMEDATA/bin"
            exit 1
          fi
          echo "Using idx directory: $idx_dir"
          echo "idx_dir=$idx_dir" >> "$GITHUB_OUTPUT"
          "$WOWSUNPACK" -i "$idx_dir" pkgs "content/GameParams.data" \
            | sed -e 's/\r$//' -e '/^$/d' -e 's#^#res_packages/#' \
            | sort -u > pkgs.txt
          count=$(wc -l < pkgs.txt)
          if [ "$count" -eq 0 ]; then
            echo "::error::No pkg files found for content/GameParams.data below $idx_dir"
            exit 1
          fi
          echo "Found $count pkg file(s):"
          cat pkgs.txt
          echo "pkgs=pkgs.txt" >> "$GITHUB_OUTPUT"

      - name: Download pkg files
        uses: ./.github/actions/download-depot
        with:
          downloader: ${{ steps.downloader.outputs.path }}
          app: ${{ env.WOWS_APP }}
          depot: ${{ env.WOWS_CLIENT_DEPOT }}
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          manifest: ${{ steps.manifest.outputs.manifest-id }}
          filelist: ${{ steps.pkgs.outputs.pkgs }}
          directory: ${{ env.GAMEDATA }}

      - name: Extract GameParams.data
        id: extract
        env:
          WOWSUNPACK: ${{ steps.wowsunpack.outputs.path }}
          IDX_DIR: ${{ steps.pkgs.outputs.idx_dir }}
        run: |
          # extract matches globs against the raw file tree paths, which carry a
          # leading slash - unlike pkgs, which strips it from both sides
          "$WOWSUNPACK" --idx-files "$IDX_DIR" --pkg-dir "$GAMEDATA/res_packages" \
            extract --out-dir extracted /content/GameParams.data
          gameparams=$(find extracted -type f -name GameParams.data 2> /dev/null | head -n 1)
          if [ -z "$gameparams" ]; then
            echo "::error::GameParams.data was not extracted"
            exit 1
          fi
          echo "Extracted $gameparams ($(du -h "$gameparams" | cut -f1))"
          echo "gameparams=$gameparams" >> "$GITHUB_OUTPUT"

      - name: Create res download filter
        id: res
        env:
          IDX_DIR: ${{ steps.pkgs.outputs.idx_dir }}
        run: |
          build=$(basename "$(dirname "$IDX_DIR")")
          echo "Using build: $build"
          {
            echo "regex:^bin/$build/res/texts/.*"
            echo "bin/$build/res/gui/lobby/shipstree_EU.xml"
          } > res-files.txt
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "filter=res-files.txt" >> "$GITHUB_OUTPUT"
          echo "texts=$GAMEDATA/bin/$build/res/texts" >> "$GITHUB_OUTPUT"
          echo "shipstree=$GAMEDATA/bin/$build/res/gui/lobby/shipstree_EU.xml" >> "$GITHUB_OUTPUT"

      - name: Download res files
        uses: ./.github/actions/download-depot
        with:
          downloader: ${{ steps.downloader.outputs.path }}
          app: ${{ env.WOWS_APP }}
          depot: ${{ env.WOWS_RES_DEPOT }}
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          filelist: ${{ steps.res.outputs.filter }}
          directory: ${{ env.GAMEDATA }}

      - name: Verify res files
        env:
          TEXTS: ${{ steps.res.outputs.texts }}
          SHIPSTREE: ${{ steps.res.outputs.shipstree }}
        run: |
          if [ ! -d "$TEXTS" ] || [ -z "$(ls -A "$TEXTS")" ]; then
            echo "::error::No files were downloaded below $TEXTS"
            exit 1
          fi
          if [ ! -f "$SHIPSTREE" ]; then
            echo "::error::$SHIPSTREE was not downloaded"
            exit 1
          fi
          echo "Downloaded $(find "$TEXTS" -type f | wc -l) files below $TEXTS"

      - name: Download Modifiers.json
        id: modifiers
        env:
          GH_TOKEN: ${{ github.token }}
          MODIFIERS_URL: ${{ inputs.modifiers-url }}
        run: |
          if [ -n "$MODIFIERS_URL" ]; then
            echo "Using custom modifiers file: $MODIFIERS_URL"
            curl -fsSL "$MODIFIERS_URL" -o Modifiers.json
            echo "source=$MODIFIERS_URL" >> "$GITHUB_OUTPUT"
          else
            # without a ref, the contents api serves the default branch
            echo "Using Modifiers.json from the DataConverter default branch"
            gh api repos/WoWs-Builder-Team/DataConverter/contents/DataConverter/JsonData/Modifiers.json \
              -H "Accept: application/vnd.github.raw" > Modifiers.json
            echo "source=WoWs-Builder-Team/DataConverter (default branch)" >> "$GITHUB_OUTPUT"
          fi
          jq empty Modifiers.json
          echo "Downloaded Modifiers.json ($(du -h Modifiers.json | cut -f1))"
          echo "modifiers=Modifiers.json" >> "$GITHUB_OUTPUT"

      - name: Bundle game data
        id: bundle
        env:
          VERSION: ${{ inputs.game-version }}
          TEXTS: ${{ steps.res.outputs.texts }}
          SHIPSTREE: ${{ steps.res.outputs.shipstree }}
          GAMEPARAMS: ${{ steps.extract.outputs.gameparams }}
          MODIFIERS: ${{ steps.modifiers.outputs.modifiers }}
        run: |
          rm -rf bundle
          mkdir -p bundle
          cp -r "$TEXTS" bundle/texts
          cp "$GAMEPARAMS" bundle/GameParams.data
          cp "$MODIFIERS" bundle/Modifiers.json
          cp "$SHIPSTREE" bundle/shipstree_EU.xml
          (cd bundle && zip -9 -r -q "../$VERSION.zip" texts GameParams.data Modifiers.json shipstree_EU.xml)
          echo "Created $VERSION.zip ($(du -h "$VERSION.zip" | cut -f1))"
          unzip -l "$VERSION.zip"
          echo "bundle=$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Upload game data bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # uploads the zip as-is, so it does not end up nested in another zip
          path: ${{ steps.bundle.outputs.bundle }}
          archive: false
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

      - name: Write job summary
        env:
          VERSION: ${{ inputs.game-version }}
          BUILD: ${{ steps.res.outputs.build }}
          MANIFEST_ID: ${{ steps.manifest.outputs.manifest-id }}
          BUNDLE: ${{ steps.bundle.outputs.bundle }}
          MODIFIERS_SOURCE: ${{ steps.modifiers.outputs.source }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          # the locale decides the decimal separator, so pin it for stable output
          file_size() { LC_ALL=C numfmt --to=iec --format='%.1f' "$(stat -c %s "$1")"; }
          dir_size() { LC_ALL=C numfmt --to=iec --format='%.1f' "$(du -sb "$1" | cut -f1)"; }
          {
            echo "# Game data $VERSION"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Artifact | [\`$BUNDLE\`]($ARTIFACT_URL) |"
            echo "| Size | $(file_size "$BUNDLE") |"
            echo "| Expires | in $ARTIFACT_RETENTION_DAYS days |"
            echo "| Game version | \`$VERSION\` |"
            echo "| Game build | \`$BUILD\` |"
            echo "| Client depot | \`$WOWS_CLIENT_DEPOT\` (manifest \`$MANIFEST_ID\`) |"
            echo "| Res depot | \`$WOWS_RES_DEPOT\` |"
            echo "| Modifiers source | $MODIFIERS_SOURCE |"
            if [ -n "$ARTIFACT_DIGEST" ]; then
              echo "| Artifact sha256 | \`$ARTIFACT_DIGEST\` |"
            fi
            echo
            echo "## Contents"
            echo
            echo "| Entry | Size |"
            echo "| --- | --- |"
            echo "| \`texts/\` | $(dir_size bundle/texts) in $(find bundle/texts -type f | wc -l) files |"
            echo "| \`GameParams.data\` | $(file_size bundle/GameParams.data) |"
            echo "| \`Modifiers.json\` | $(file_size bundle/Modifiers.json) |"
            echo "| \`shipstree_EU.xml\` | $(file_size bundle/shipstree_EU.xml) |"
            echo
            echo "## Tools"
            echo
            echo "| Tool | Version |"
            echo "| --- | --- |"
            echo "| DepotDownloader | \`$DEPOT_DOWNLOADER_TAG\` |"
            echo "| wowsunpack | \`$WOWS_TOOLKIT_TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
